name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    # A real PostgreSQL service. The unit suite below mocks its repositories and does not use it;
    # the access-control suite (npm run test:integration) does, on a schema built by running the
    # repository's own migrations.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asset_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: asset_vault_test
      JWT_SECRET: ci-test-secret-not-used-anywhere-real
      # Dates in fixtures are compared literally; without a fixed zone the suite
      # passes locally and fails on a runner in a different offset.
      TZ: UTC

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: ./backend
        run: npm ci

      - name: Lint
        working-directory: ./backend
        run: npm run lint -- --max-warnings=0
        continue-on-error: true

      - name: Build
        working-directory: ./backend
        # `prebuild` runs lint with --fix, which would mask failures in CI.
        run: npx nest build

      # GATING. Unit tests mock their database repositories (no PostgreSQL involved).
      - name: Unit tests (mocked dependencies)
        working-directory: ./backend
        run: npm test -- --ci --runInBand --passWithNoTests

      # GATING. Builds the schema with the repository's own migrations in the empty CI database,
      # which also proves the migrations apply from scratch.
      - name: Apply migrations to the test database
        working-directory: ./backend
        env:
          CLERK_SECRET_KEY: sk_test_ci_not_a_real_key
        run: npm run migration:run

      # GATING. Boots the real application against real PostgreSQL with synthetic users and checks
      # authentication and per-user ownership. Only Clerk's network calls (and the ESM-only tRPC
      # module) are stubbed; see test/support/access-control-harness.ts. Never point this at a real
      # database: it creates and deletes users matching *@access-test.invalid.
      - name: Access-control tests (real PostgreSQL)
        working-directory: ./backend
        env:
          CLERK_SECRET_KEY: sk_test_ci_not_a_real_key
        run: npm run test:integration -- --ci

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: ./frontend
        run: npm ci

      # GATING since the error count reached 0 (224 -> 0; no rules disabled). Warnings
      # (exhaustive-deps, fast-refresh exports, incompatible-library) are reported, not gating.
      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        run: npm run build

      # Now GATING. The debt this was tracking is paid off: 358 -> 0, with no
      # suppressions and no loosened compiler options. There is nothing left to
      # tolerate, so a reintroduced error fails the build.
      #
      # `npm run typecheck` is `tsc -b --force`, and the `-b` matters. The root
      # tsconfig.json is a project-references file listing no files of its own, so
      # `tsc --noEmit -p tsconfig.json` type-checks nothing and exits 0 — it looks
      # like a clean run and is the reason this debt went unnoticed for so long.
      - name: Type-check
        working-directory: ./frontend
        run: npm run typecheck

      # GATING (component and utility tests; run `npx vitest run` for the current count).
      - name: Tests
        working-directory: ./frontend
        run: npx vitest run --passWithNoTests

  # GATING. Builds the production frontend image the way docker-compose.yml does (context = the
  # repository root, so the shared invoice-money module is included), runs it, and checks what
  # nginx actually serves. The publishable key is a syntactically valid dummy: without one the
  # bundler drops the app and only the configuration screen is left.
  frontend-image:
    name: Frontend image (docker build + smoke)
    runs-on: ubuntu-latest
    env:
      # pk_test_ + base64("dummy.clerk.accounts.dev$"). Not a real Clerk instance.
      DUMMY_PK: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA==
      MONEY_MARKER: 'must be a decimal number (no exponent'
    steps:
      - uses: actions/checkout@v7

      - name: Build the builder stage and inspect its context
        run: |
          # Decoys: local env files a developer might have. None may reach the image.
          for f in .env .env.local .env.development .env.staging; do
            echo "DECOY_SECRET=must-not-be-in-the-image" > "frontend/$f"
          done
          docker build -f frontend/Dockerfile --target builder \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY="$DUMMY_PK" -t av-frontend-builder .
          echo '--- files under /backend in the builder stage:'
          docker run --rm av-frontend-builder find /backend -type f | tee backend-files.txt
          # The root .dockerignore must admit exactly one file from backend/.
          test "$(cat backend-files.txt)" = /backend/src/common/money/invoice-money.ts
          echo '--- env files in /app:'
          docker run --rm av-frontend-builder sh -c 'ls -a /app | grep "^\.env" || true' | tee env-files.txt
          # Only the committed example may be there; .env / .env.local must never reach the build.
          if grep -vx '.env.example' env-files.txt; then echo 'unexpected env file in build context'; exit 1; fi
          if docker run --rm av-frontend-builder grep -rl DECOY_SECRET /app /backend 2>/dev/null; then
            echo 'a decoy env file reached the build context'; exit 1
          fi
          rm -f frontend/.env frontend/.env.local frontend/.env.development frontend/.env.staging

      - name: Build fails without a publishable key
        run: |
          if docker build -f frontend/Dockerfile --target builder . > no-key.log 2>&1; then
            cat no-key.log; echo 'build without VITE_CLERK_PUBLISHABLE_KEY should have failed'; exit 1
          fi
          grep -q 'VITE_CLERK_PUBLISHABLE_KEY is not set' no-key.log
          echo 'refused as expected'

      - name: Build the production image
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY="$DUMMY_PK" -t av-frontend .
          docker image ls av-frontend

      - name: Inspect the served directory
        run: |
          docker run --rm av-frontend find /usr/share/nginx/html -type f | sort | tee html-files.txt
          if grep -E '(^|/)\.env|\.map$|\.tsx?$|backend' html-files.txt; then
            echo 'served directory contains env files, source maps, sources or backend files'; exit 1
          fi
          grep -q '^/usr/share/nginx/html/index.html$' html-files.txt

      - name: Run the container and smoke-check it
        run: |
          docker run -d --name av-frontend -p 8080:80 av-frontend
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          base=http://localhost:8080

          echo '--- GET /'
          curl -fsS -D root.headers -o index.html "$base/"
          head -n1 root.headers; grep -i '^x-content-type-options' root.headers
          grep -q '<div id="root">' index.html

          echo '--- entry script referenced by index.html'
          entry=$(grep -oE 'src="/assets/[^"]+\.js"' index.html | head -n1 | cut -d'"' -f2)
          test -n "$entry"; echo "$entry"
          curl -fsS -D entry.headers -H 'Accept-Encoding: gzip' -o /dev/null "$base$entry"
          head -n1 entry.headers
          grep -iE '^content-type: (application|text)/javascript' entry.headers
          grep -i '^content-encoding: gzip' entry.headers
          grep -i '^cache-control: public, immutable' entry.headers
          grep -i '^x-content-type-options: nosniff' entry.headers

          echo '--- SPA deep link /invoices/create'
          code=$(curl -sS -o deep.html -w '%{http_code}' "$base/invoices/create")
          echo "HTTP $code"; test "$code" = 200; cmp deep.html index.html

          echo '--- missing asset is a 404, not index.html'
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$base/assets/does-not-exist.js")
          echo "HTTP $code"; test "$code" = 404

          echo '--- every served JS asset, fetched over HTTP'
          mkdir -p served
          for f in $(grep '\.js$' html-files.txt); do
            rel=${f#/usr/share/nginx/html}
            curl -fsS -o "served/$(basename "$rel")" "$base$rel"
          done
          ls served | wc -l
          echo '--- shared invoice-money module is in the bundle'
          grep -lF "$MONEY_MARKER" served/*.js
          echo '--- the build-arg key reached the bundle'
          grep -lF "$DUMMY_PK" served/*.js

      - name: Container log
        if: always()
        run: docker logs av-frontend 2>&1 | tail -n 40 || true

      - name: Build the dev image
        run: docker build -f frontend/Dockerfile.dev -t av-frontend-dev .

  # GATING. Builds the API image and validates the Compose file; does not run the API
  # (that needs a migrated database and a Clerk instance).
  backend-image:
    name: Backend image (docker build) + Compose config
    runs-on: ubuntu-latest
    env:
      CLERK_SECRET_KEY: sk_test_ci_not_a_real_key
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA==
    steps:
      - uses: actions/checkout@v7

      - name: Build the backend image
        run: |
          docker build -t av-backend backend
          docker run --rm av-backend node --version
          docker run --rm av-backend test -f dist/main.js
          docker run --rm av-backend sh -c 'test ! -d node_modules/@nestjs/cli' && echo 'no dev dependencies'

      - name: Validate docker-compose.yml
        run: |
          docker compose config --quiet
          docker compose config --services
          test "$(docker compose config --services | sort | tr '\n' ' ')" = 'backend frontend postgres proxy '
          test "$(docker compose --profile dev config --services | grep -c frontend-dev)" = 1
          # Only the TLS proxy publishes ports on all interfaces; PostgreSQL only on loopback.
          docker compose config --format json > compose.json
          node -e '
            const c = require("./compose.json").services;
            const published = (s) => (c[s].ports || []).map((p) => `${p.host_ip || "0.0.0.0"}:${p.published}`);
            for (const s of ["backend", "frontend"]) if (published(s).length) throw new Error(`${s} publishes ${published(s)}`);
            if (published("proxy").sort().join() !== "0.0.0.0:443,0.0.0.0:80") throw new Error(`proxy publishes ${published("proxy")}`);
            if (published("postgres").some((p) => !p.startsWith("127.0.0.1:"))) throw new Error(`postgres publishes ${published("postgres")}`);
            console.log("published ports OK:", JSON.stringify(Object.fromEntries(Object.keys(c).map((s) => [s, published(s)]))));
          '

      - name: Start the postgres service
        run: |
          docker compose up -d --wait postgres
          docker compose exec -T postgres psql -U postgres -d invoiceme -c 'select 1'
          docker compose down -v

  # GATING. The built API image, the built frontend and PostgreSQL running together, with
  # synthetic data only (users *@full-stack.invalid in a throwaway CI database).
  #
  # Real: the API image from backend/Dockerfile running dist/main with NODE_ENV=production, the
  # schema built by the repository's migrations, every guard, and @clerk/backend verifyToken()
  # checking RS256 session tokens signed with a key pair generated in this job and given to the
  # API as CLERK_JWT_KEY (the SDK's networkless mode). The frontend is a production `vite build`
  # served by `vite preview`, checked over HTTP and in headless Chromium.
  #
  # Stand-in: Clerk's users.getUser(), the per-request user re-check, is answered from a file by
  # backend/test/full-stack/clerk-users-stub.cjs, preloaded with NODE_OPTIONS and mounted
  # read-only; it is not in the image. A local HTTP stub of Clerk's API is not possible without
  # an application change: the guard calls createClerkClient({ secretKey }) with no apiUrl, and
  # @clerk/backend does not read one from the environment.
  #
  # Not covered: signing in through Clerk in the browser (clerk-js loads from a real Clerk
  # instance's frontend API), and therefore the web app's own authenticated API calls.
  full-stack:
    name: Full stack (API image + built frontend + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asset_vault_full_stack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: asset_vault_full_stack
      # Not a real Clerk key; the stub refuses to load with anything but sk_test_.
      CLERK_SECRET_KEY: sk_test_full_stack_not_a_real_key
      # pk_test_ + base64("dummy.clerk.accounts.dev$"). Not a real Clerk instance.
      DUMMY_PK: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA==
      API_URL: http://localhost:3000/api/v1
      FRONTEND_ORIGIN: http://localhost:4173
      TZ: UTC
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # The API image has no migration runner, so the schema is built from the checkout.
      - name: Install backend and apply migrations
        working-directory: ./backend
        run: |
          npm ci
          npm run migration:run

      - name: Build the API image
        run: docker build -t av-backend backend

      - name: Generate the throwaway signing keys and synthetic Clerk users
        run: node backend/test/full-stack/prepare.cjs "$RUNNER_TEMP/full-stack"

      - name: Start the API
        run: |
          docker run -d --name av-api --network host \
            -v "$GITHUB_WORKSPACE/backend/test/full-stack:/full-stack:ro" \
            -v "$RUNNER_TEMP/full-stack/clerk-directory.json:/fs/clerk-directory.json:ro" \
            -e NODE_ENV=production -e PORT=3000 \
            -e TRUST_PROXY=loopback \
            -e DB_HOST -e DB_PORT -e DB_USERNAME -e DB_PASSWORD -e DB_DATABASE \
            -e CLERK_SECRET_KEY \
            -e CLERK_JWT_KEY="$(cat "$RUNNER_TEMP/full-stack/jwt-public.pem")" \
            -e FRONTEND_URL="$FRONTEND_ORIGIN" \
            -e FULL_STACK_CLERK_STUB=1 -e FULL_STACK_CLERK_DIRECTORY=/fs/clerk-directory.json \
            -e NODE_OPTIONS='--require /full-stack/clerk-users-stub.cjs' \
            av-backend
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null -H 'X-Forwarded-Proto: https' "$API_URL/health" && break
            if [ "$(docker inspect -f '{{.State.Running}}' av-api)" != true ]; then docker logs av-api; exit 1; fi
            sleep 1
          done
          curl -fsS -H 'X-Forwarded-Proto: https' "$API_URL/health"; echo
          docker logs av-api 2>&1 | grep -F '[clerk-users-stub]'

      # Authentication (real verifyToken; forged, expired, alg-confusion, unknown and banned users),
      # invoice create / read / edit with totals checked against hand-computed values and the
      # database row, and ownership checks with a second user.
      - name: API flow (invoices, totals, ownership)
        working-directory: ./backend
        run: node test/full-stack/flow.cjs "$RUNNER_TEMP/full-stack"

      - name: Build the frontend against this API
        working-directory: ./frontend
        run: |
          npm ci
          VITE_CLERK_PUBLISHABLE_KEY="$DUMMY_PK" VITE_API_BASE_URL="$API_URL" npx vite build --manifest
          echo '--- the bundle calls this API'
          grep -lF "$API_URL" dist/assets/*.js

      - name: Serve it and check every route's chunk over HTTP
        working-directory: ./frontend
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null "$FRONTEND_ORIGIN/" && break; sleep 1; done
          node scripts/verify-route-chunks.mjs "$FRONTEND_ORIGIN" dist

      - name: Browser check (lazy page renders; failed chunk is recoverable)
        working-directory: ./frontend
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.59.1
          npx playwright install --with-deps chromium
          node scripts/browser-smoke.mjs "$FRONTEND_ORIGIN"

      - name: API log
        if: always()
        run: docker logs av-api 2>&1 | tail -n 80 || true

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Reported, not gating: a transitive advisory in a dev dependency should not
      # block a merge, but it should be visible in the run log.
      - name: Backend audit
        working-directory: ./backend
        run: npm audit --audit-level=high || true
      - name: Frontend audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

  # GATING. The migration release procedure (docs/operations/MIGRATIONS.md) on real containers:
  # the production backend image (compiled JS, production dependencies only) against a disposable
  # PostgreSQL 16 container. Proves: an outdated schema blocks API startup; a failing migration
  # stops docs/operations/release.sh before the API starts and leaves the database untouched; the
  # documented image command applies 1761000000000; the API then starts and serves /api/v1/health;
  # a rerun changes nothing; invoice_items rates and invoice totals are unchanged by the upgrade.
  migration-release:
    name: Migration release (backend image + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        # Explicit bash = `bash -eo pipefail`: a failure piped into tee still fails the step.
        shell: bash
    env:
      NET: av-release
      DB: asset_vault_release
      LAST: WidenInvoiceItemRatePrecision1761000000000
    steps:
      - uses: actions/checkout@v7

      - name: Build the backend image and start a disposable PostgreSQL
        run: |
          docker build -t av-backend backend
          docker network create "$NET"
          docker run -d --name av-pg --network "$NET" -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB="$DB" \
            --health-cmd pg_isready --health-interval 2s postgres:16-alpine
          for i in $(seq 1 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' av-pg)" = healthy ] && break; sleep 1; done
          docker exec av-pg psql -U postgres -d "$DB" -c 'select version()'
          cat > api.env <<EOF
          DB_HOST=av-pg
          DB_PORT=5432
          DB_USERNAME=postgres
          DB_PASSWORD=postgres
          DB_DATABASE=$DB
          CLERK_SECRET_KEY=sk_test_ci_not_a_real_key
          NODE_ENV=production
          FRONTEND_URL=https://localhost
          TRUST_PROXY=loopback
          EOF
          sed -i 's/^ *//' api.env
          # Helpers for later steps.
          cat > sql.sh <<'EOF'
          #!/usr/bin/env bash
          docker exec -i av-pg psql -v ON_ERROR_STOP=1 -U postgres -d "$DB" -At -F'|' "$@"
          EOF
          sed -i 's/^ *//' sql.sh && chmod +x sql.sh

      - name: Outdated schema - every migration except the last, plus invoice data
        run: |
          # The released image's own runner, with the newest migration removed inside a throwaway container.
          docker run --rm --network "$NET" --env-file api.env --entrypoint sh av-backend \
            -c "rm dist/migrations/1761000000000-* && node dist/database/migration-runner.js"
          test "$(./sql.sh -c 'select count(*) from migrations')" = 40
          test "$(./sql.sh -c "select count(*) from migrations where name = '$LAST'")" = 0
          test "$(./sql.sh -c "select numeric_precision||','||numeric_scale from information_schema.columns where table_name='invoice_items' and column_name='taxRate'")" = 5,2
          ./sql.sh <<'SQL'
          INSERT INTO users (id, email, name) VALUES ('00000000-0000-4000-8000-000000000001', 'release@migration-test.invalid', 'Release check');
          INSERT INTO clients (id, "userId", name) VALUES ('00000000-0000-4000-8000-000000000002', '00000000-0000-4000-8000-000000000001', 'Release check client');
          INSERT INTO invoices (id, "userId", "clientId", type, number, status, "issueDate", subtotal, "taxTotal", "discountTotal", total)
          VALUES ('00000000-0000-4000-8000-000000000003', '00000000-0000-4000-8000-000000000001', '00000000-0000-4000-8000-000000000002',
                  'invoice', 'MIG-0001', 'draft', '2026-10-01', 200.0100, 17.7612, 10.0000, 207.7712);
          INSERT INTO invoice_items ("invoiceId", description, quantity, "unitPrice", "taxRate", "discountRate", "lineTotal") VALUES
            ('00000000-0000-4000-8000-000000000003', 'A two-decimal rates', 1, 100.0000, 8.88, 5.00, 103.4400),
            ('00000000-0000-4000-8000-000000000003', 'B max rates', 2, 50.0000, 999.99, 999.99, 104.3200),
            ('00000000-0000-4000-8000-000000000003', 'C tiny values', 1, 0.0100, 0.01, 0.00, 0.0100),
            ('00000000-0000-4000-8000-000000000003', 'D zero rates', 3, 33.3333, 0, 0, 99.9999);
          SQL
          cat > snapshot.sql <<'SQL'
          SELECT 'item', description, quantity, "unitPrice"::text, round("taxRate", 4)::text, round("discountRate", 4)::text, "lineTotal"::text FROM invoice_items ORDER BY description;
          SELECT 'invoice', number, subtotal::text, "taxTotal"::text, "discountTotal"::text, total::text, coalesce("amountPaid", 0)::text FROM invoices ORDER BY number;
          SQL
          ./sql.sh < snapshot.sql | tee before.txt
          test "$(wc -l < before.txt)" = 5

      - name: (a) The API refuses to start on the outdated schema
        run: |
          set +e
          docker run --name av-api-outdated --network "$NET" --env-file api.env av-backend > outdated.log 2>&1
          code=$?
          set -e
          cat outdated.log
          echo "exit code: $code"; test "$code" -ne 0
          grep -F 'Startup aborted: database schema is not current.' outdated.log
          grep -F "  - $LAST" outdated.log
          grep -F 'node dist/database/migration-runner.js' outdated.log
          if grep -F 'Nest application successfully started' outdated.log; then echo 'the API started'; exit 1; fi
          # The check is read-only.
          test "$(./sql.sh -c 'select count(*) from migrations')" = 40

      - name: (a) The API refuses to start when the database is unreachable
        run: |
          set +e
          docker run --rm --network "$NET" --env-file api.env -e DB_PORT=5999 av-backend > unreachable.log 2>&1
          code=$?
          set -e
          cat unreachable.log
          echo "exit code: $code"; test "$code" -ne 0
          grep -F 'Startup aborted: database unreachable.' unreachable.log
          grep -F 'Cannot connect to the database at av-pg:5999' unreachable.log

      - name: (e) A failing migration stops the release before the API starts
        run: |
          # Test-only image: the released image plus a harmless migration and one that must fail.
          # Never committed to backend/src/migrations.
          mkdir failing && cd failing
          cat > 1799999999998-ReleaseCheckMarker.js <<'EOF'
          "use strict";
          Object.defineProperty(exports, "__esModule", { value: true });
          class ReleaseCheckMarker1799999999998 { constructor() { this.name = 'ReleaseCheckMarker1799999999998'; }
            async up(q) { await q.query('CREATE TABLE "release_check_marker" (id int)'); }
            async down(q) { await q.query('DROP TABLE "release_check_marker"'); } }
          exports.ReleaseCheckMarker1799999999998 = ReleaseCheckMarker1799999999998;
          EOF
          cat > 1799999999999-ReleaseCheckMustFail.js <<'EOF'
          "use strict";
          Object.defineProperty(exports, "__esModule", { value: true });
          class ReleaseCheckMustFail1799999999999 { constructor() { this.name = 'ReleaseCheckMustFail1799999999999'; }
            async up(q) { await q.query('ALTER TABLE "invoice_items" ALTER COLUMN "taxRate" TYPE numeric(7,4) USING ("taxRate" / 0)'); }
            async down() {} }
          exports.ReleaseCheckMustFail1799999999999 = ReleaseCheckMustFail1799999999999;
          EOF
          printf 'FROM av-backend\nCOPY *.js dist/migrations/\n' > Dockerfile
          docker build -t av-backend-failing .
          cd ..
          set +e
          DOCKER_NETWORK="$NET" BACKUP_DIR=backups-failing API_CONTAINER=av-api-failing API_PORT=3001 \
            docs/operations/release.sh av-backend-failing api.env > failing.log 2>&1
          code=$?
          set -e
          cat failing.log
          echo "release exit code: $code"; test "$code" -ne 0
          grep -F 'pending: WidenInvoiceItemRatePrecision1761000000000' failing.log
          grep -F 'Migration FAILED; the transaction was rolled back' failing.log
          if grep -F '== 3/4' failing.log; then echo 'the release continued past the failed migration'; exit 1; fi
          test -z "$(docker ps -aq --filter name=^av-api-failing$)" && echo 'API container never created'
          # Nothing from the failed run was kept: not the marker, not 1761000000000.
          test "$(./sql.sh -c 'select count(*) from migrations')" = 40
          test "$(./sql.sh -c "select to_regclass('release_check_marker') is null")" = t
          test "$(./sql.sh -c "select numeric_precision||','||numeric_scale from information_schema.columns where table_name='invoice_items' and column_name='taxRate'")" = 5,2
          ./sql.sh < snapshot.sql | diff before.txt -

      - name: (b)(c) Release - backup, the documented image command, startup, health
        run: |
          DOCKER_NETWORK="$NET" BACKUP_DIR=backups API_CONTAINER=av-api API_PORT=3000 \
            docs/operations/release.sh av-backend api.env | tee release.log
          grep -F 'backup written and readable' release.log
          grep -F 'Database av-pg:5432/asset_vault_release as postgres: 41 migration(s) in this build, 1 pending.' release.log
          grep -F 'Applied 1 migration(s):' release.log
          grep -F "  - $LAST" release.log
          grep -F '"status":"ok"' release.log
          ls -l backups/*.dump
          docker logs av-api 2>&1 | grep -F 'Database schema is current (41 migrations applied).'
          docker exec av-api node dist/server/healthcheck.js | tee health.json
          grep -F '"status":"ok"' health.json
          # From the host the peer is Docker's bridge, which TRUST_PROXY=loopback does not trust:
          # a forged X-Forwarded-Proto / Host is ignored, and the redirect goes to FRONTEND_URL.
          curl -sS -o /dev/null -D spoof.headers -H 'X-Forwarded-Proto: https' -H 'Host: evil.example' \
            -H 'X-Forwarded-Host: evil.example' http://127.0.0.1:3000/api/v1/health
          cat spoof.headers
          head -n1 spoof.headers | grep -F ' 301 '
          grep -Fix 'location: https://localhost/api/v1/health' <(tr -d '\r' < spoof.headers)
          test "$(./sql.sh -c "select count(*) from migrations where name = '$LAST'")" = 1

      - name: (f) Rates and totals unchanged across the upgrade
        run: |
          ./sql.sh < snapshot.sql | tee after.txt
          diff before.txt after.txt && echo 'invoice_items rates and invoice totals identical'
          test "$(./sql.sh -c "select string_agg(column_name||' '||numeric_precision||','||numeric_scale, '; ' order by column_name) from information_schema.columns where table_name='invoice_items' and column_name in ('taxRate','discountRate')")" = 'discountRate 7,4; taxRate 7,4'
          # The new precision is usable (inside a transaction that is rolled back).
          ./sql.sh -c "begin; update invoice_items set \"taxRate\" = 8.875 where description = 'A two-decimal rates'; select \"taxRate\" from invoice_items where description = 'A two-decimal rates'; rollback;" | grep -x '8.8750'

      - name: (d) Rerunning the migration command changes nothing
        run: |
          # Stop the API so only the migration command can touch the database between the dumps.
          docker stop av-api
          test "$(docker inspect -f '{{.State.ExitCode}}' av-api)" = 0
          # pg_dump >= 16.10 brackets its output with \restrict/\unrestrict and a random key per run.
          dump() { docker exec av-pg pg_dump -U postgres -d "$DB" | grep -vE '^\\(un)?restrict '; }
          dump > dump-before.sql
          docker run --rm --network "$NET" --env-file api.env av-backend node dist/database/migration-runner.js | tee rerun.log
          grep -Fx 'No pending migrations. Nothing was changed.' rerun.log
          dump > dump-after.sql
          wc -l dump-before.sql
          diff dump-before.sql dump-after.sql && echo 'schema and data identical after the rerun'

      - name: Container logs
        if: always()
        run: |
          for c in av-api av-api-outdated; do echo "--- $c"; docker logs "$c" 2>&1 | tail -n 40 || true; done

  # GATING. Graceful shutdown of the production API image (src/server/graceful-shutdown.ts), on a
  # schema built by the repository's migrations in a disposable PostgreSQL service. A request is
  # held in flight across `docker stop` (SIGTERM to PID 1) by test/server/shutdown-probe.cjs:
  # it must complete with 200, new connections must be refused, the container must exit 0 within
  # the bound; a request that never completes must make the API exit 1 at the bound.
  api-shutdown:
    name: API graceful shutdown (backend image + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asset_vault_shutdown
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: asset_vault_shutdown
      CLERK_SECRET_KEY: sk_test_ci_not_a_real_key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend and apply migrations
        working-directory: ./backend
        run: |
          npm ci
          npm run migration:run

      - name: Build the API image
        run: docker build -t av-backend backend

      - name: Helper to start the API container
        run: |
          cat > start-api.sh <<'SH'
          #!/usr/bin/env bash
          # start-api.sh <name> [extra docker run args...]
          set -euo pipefail
          name=$1; shift
          docker rm -f "$name" > /dev/null 2>&1 || true
          docker run -d --name "$name" --network host \
            -e NODE_ENV=production -e PORT=3000 -e TRUST_PROXY=loopback -e FRONTEND_URL=https://localhost \
            -e DB_HOST -e DB_PORT -e DB_USERNAME -e DB_PASSWORD -e DB_DATABASE -e CLERK_SECRET_KEY \
            "$@" av-backend > /dev/null
          for i in $(seq 1 60); do
            docker exec "$name" node dist/server/healthcheck.js > /dev/null 2>&1 && exit 0
            if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != true ]; then docker logs "$name"; exit 1; fi
            sleep 1
          done
          docker logs "$name"; exit 1
          SH
          chmod +x start-api.sh

      - name: PID 1 is node, and SIGTERM is the stop signal
        run: |
          ./start-api.sh av-api
          docker exec av-api sh -c 'tr "\0" " " < /proc/1/cmdline; echo' | tee pid1.txt
          grep -qx 'node dist/main ' pid1.txt
          test "$(docker inspect -f '{{.Config.StopSignal}}' av-api)" = SIGTERM
          docker logs av-api 2>&1 | grep -F 'Graceful shutdown armed (SIGTERM/SIGINT, bound 8000 ms).'

      - name: In-flight request completes across docker stop; exit 0 under the bound
        run: |
          # docker stop -t 30 so that Docker's SIGKILL cannot be what ends the container: the
          # API's own 8000 ms bound has to.
          STOP_CMD='docker stop -t 30 av-api > /dev/null' HOLD_MS=2000 \
            node backend/test/server/shutdown-probe.cjs complete | tee probe-complete.txt
          code=$(docker inspect -f '{{.State.ExitCode}}' av-api)
          stop_ms=$(sed -n 's/.*"stopMs":\([0-9]*\).*/\1/p' probe-complete.txt)
          docker logs av-api 2>&1 | grep -F 'Shutdown:' | tee shutdown-complete.log
          echo "exit code: $code; docker stop took ${stop_ms} ms (bound 8000 ms)"
          echo "### Graceful shutdown: in-flight request completed, exit $code, docker stop ${stop_ms} ms (bound 8000 ms)" >> "$GITHUB_STEP_SUMMARY"
          test "$code" = 0
          test "$stop_ms" -lt 8000
          grep -F 'Shutdown: SIGTERM received' shutdown-complete.log
          grep -F 'Shutdown: complete in' shutdown-complete.log
          if docker logs av-api 2>&1 | grep -F 'forcing exit 1'; then exit 1; fi

      - name: Idle API stops promptly under plain docker stop (no SIGKILL, exit 0)
        run: |
          ./start-api.sh av-api-idle
          start=$(date +%s%3N)
          docker stop av-api-idle > /dev/null
          end=$(date +%s%3N)
          code=$(docker inspect -f '{{.State.ExitCode}}' av-api-idle)
          echo "idle stop: exit $code in $((end - start)) ms"
          echo "### Idle stop: exit $code in $((end - start)) ms" >> "$GITHUB_STEP_SUMMARY"
          test "$code" = 0
          test $((end - start)) -lt 5000

      - name: A request that never completes forces exit 1 at the bound
        run: |
          ./start-api.sh av-api-hang -e SHUTDOWN_TIMEOUT_MS=3000
          STOP_CMD='docker stop -t 30 av-api-hang > /dev/null' \
            node backend/test/server/shutdown-probe.cjs hang | tee probe-hang.txt
          code=$(docker inspect -f '{{.State.ExitCode}}' av-api-hang)
          stop_ms=$(sed -n 's/.*"stopMs":\([0-9]*\).*/\1/p' probe-hang.txt)
          docker logs av-api-hang 2>&1 | grep -F 'Shutdown:'
          echo "exit code: $code; docker stop took ${stop_ms} ms (bound 3000 ms)"
          echo "### Forced shutdown: exit $code after ${stop_ms} ms (bound 3000 ms)" >> "$GITHUB_STEP_SUMMARY"
          test "$code" = 1
          test "$stop_ms" -ge 3000
          test "$stop_ms" -lt 5000
          docker logs av-api-hang 2>&1 | grep -F 'forcing exit 1.'

      - name: Container logs
        if: always()
        run: for c in av-api av-api-idle av-api-hang; do echo "--- $c"; docker logs "$c" 2>&1 | tail -n 30 || true; done

  # GATING. The documented Compose stack (docker-compose.yml + deploy/caddy/Caddyfile) exactly as
  # docs/setup/DOCKER_README.md runs it, with dummy Clerk keys: the API refuses to start before
  # the migrations, then https://localhost serves the web app and the API through Caddy with a
  # certificate verified against Caddy's local CA, HTTP is redirected to HTTPS, the API and nginx
  # are not reachable unproxied, CORS answers through the proxy, and the API stops gracefully.
  compose-proxy:
    name: Compose stack behind the TLS proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Root .env (dummy keys) and build
        run: |
          printf '%s\n' 'CLERK_SECRET_KEY=sk_test_ci_not_a_real_key' \
            'VITE_CLERK_PUBLISHABLE_KEY=pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA==' > .env
          docker compose build
          docker compose pull proxy postgres

      - name: Before migrations, the API refuses to start (checked first, behind the proxy too)
        run: |
          docker compose up -d
          for i in $(seq 1 90); do
            [ "$(docker inspect -f '{{.State.Status}}' asset-vault-backend)" = exited ] && break; sleep 1
          done
          docker compose ps -a
          test "$(docker inspect -f '{{.State.Status}}' asset-vault-backend)" = exited
          test "$(docker inspect -f '{{.State.ExitCode}}' asset-vault-backend)" = 1
          docker compose logs backend > backend-premigration.log 2>&1
          grep -F 'Startup aborted: database schema is not current.' backend-premigration.log
          if grep -F 'Nest application successfully started' backend-premigration.log; then echo 'the API started'; exit 1; fi
          # Caddy's local CA is created at startup; export its root to verify the certificate.
          for i in $(seq 1 30); do
            docker compose cp proxy:/data/caddy/pki/authorities/local/root.crt caddy-root.crt 2> /dev/null && break; sleep 1
          done
          openssl x509 -in caddy-root.crt -noout -subject
          code=$(curl -sS -o /dev/null -w '%{http_code}' --cacert caddy-root.crt https://localhost/api/v1/health)
          echo "API through the proxy while it is down: HTTP $code"; test "$code" = 502

      - name: Apply migrations and start the stack (documented commands)
        run: |
          docker compose run --rm backend node dist/database/migration-runner.js | tee migrate.log
          grep -F 'Migrations complete' migrate.log || grep -F 'Applied' migrate.log
          docker compose up -d --wait --wait-timeout 120
          docker compose ps
          docker compose logs backend 2>&1 | grep -F 'Database schema is current'

      - name: https://localhost serves the web app (certificate verified)
        run: |
          curl -fsS --cacert caddy-root.crt -D web.headers -o index.html https://localhost/
          head -n1 web.headers
          grep -q '<div id="root">' index.html
          code=$(curl -sS -o /dev/null -w '%{http_code}' --cacert caddy-root.crt https://localhost/invoices/create)
          echo "SPA deep link: HTTP $code"; test "$code" = 200
          echo '--- the bundle calls the API on the same origin (/api/v1), not http://localhost:3000'
          docker compose exec -T frontend sh -c 'cat /usr/share/nginx/html/assets/*.js' > bundle.js
          ls -l bundle.js
          grep -oE '.{0,20}/api/v1.{0,12}' bundle.js | sort -u | head
          grep -qE '["`]/api/v1' bundle.js

      - name: The API answers through the proxy
        run: |
          curl -fsS --cacert caddy-root.crt https://localhost/api/v1/health | tee health.json; echo
          grep -F '"status":"ok"' health.json
          # Forged forwarding headers from the client are replaced by Caddy's own.
          # A client claiming X-Forwarded-Proto: http would be redirected (301) if Caddy passed it on;
          # Caddy replaces it with the real scheme, so the API answers 200.
          code=$(curl -sS --cacert caddy-root.crt -H 'X-Forwarded-Proto: http' -H 'X-Forwarded-Host: evil.example' \
            -o /dev/null -w '%{http_code}' https://localhost/api/v1/health)
          echo "forged X-Forwarded-* through the proxy: HTTP $code"; test "$code" = 200

      - name: HTTP is redirected to HTTPS
        run: |
          for path in / /api/v1/health; do
            out=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "http://localhost$path")
            echo "http://localhost$path -> $out"
            test "$out" = "308 https://localhost$path"
          done

      - name: The API and the web server are not exposed unproxied
        run: |
          for c in asset-vault-backend asset-vault-frontend; do
            ports=$(docker inspect -f '{{json .NetworkSettings.Ports}}' "$c")
            echo "$c: $ports"
            if echo "$ports" | grep -q HostPort; then echo "$c publishes a host port"; exit 1; fi
          done
          if curl -sS -m 5 -o /dev/null http://127.0.0.1:3000/api/v1/health; then echo 'API reachable on :3000'; exit 1; fi
          echo 'API not reachable on the host (expected)'

      - name: CORS through the proxy
        run: |
          curl -sS --cacert caddy-root.crt -D allowed.headers -o /dev/null -H 'Origin: https://localhost' https://localhost/api/v1/health
          tr -d '\r' < allowed.headers > a.h; cat a.h
          grep -Fix 'access-control-allow-origin: https://localhost' a.h
          grep -Fix 'access-control-allow-credentials: true' a.h
          code=$(curl -sS --cacert caddy-root.crt -D evil.headers -o evil.json -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://evil.example' -H 'Access-Control-Request-Method: POST' https://localhost/api/v1/clients)
          tr -d '\r' < evil.headers > e.h; cat e.h evil.json; echo
          test "$code" = 403
          if grep -i '^access-control-allow' e.h; then echo 'CORS headers for a disallowed origin'; exit 1; fi
          grep -F '"Origin not allowed"' evil.json

      - name: docker compose stop backend is graceful
        run: |
          start=$(date +%s%3N)
          docker compose stop backend
          end=$(date +%s%3N)
          code=$(docker inspect -f '{{.State.ExitCode}}' asset-vault-backend)
          echo "compose stop backend: exit $code in $((end - start)) ms"
          echo "### Compose: docker compose stop backend -> exit $code in $((end - start)) ms" >> "$GITHUB_STEP_SUMMARY"
          test "$code" = 0
          docker compose logs backend 2>&1 | grep -F 'Shutdown: complete in'
          code=$(curl -sS -o /dev/null -w '%{http_code}' --cacert caddy-root.crt https://localhost/api/v1/health)
          echo "API through the proxy after stop: HTTP $code"; test "$code" = 502

      - name: Logs
        if: always()
        run: docker compose logs --no-color 2>&1 | tail -n 150 || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true
