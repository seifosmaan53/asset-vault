name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    # A real PostgreSQL service. The unit suite below mocks its repositories and does not use it;
    # the access-control suite (npm run test:integration) does, on a schema built by running the
    # repository's own migrations.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asset_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: asset_vault_test
      JWT_SECRET: ci-test-secret-not-used-anywhere-real
      # Dates in fixtures are compared literally; without a fixed zone the suite
      # passes locally and fails on a runner in a different offset.
      TZ: UTC

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: ./backend
        run: npm ci

      - name: Lint
        working-directory: ./backend
        run: npm run lint -- --max-warnings=0
        continue-on-error: true

      - name: Build
        working-directory: ./backend
        # `prebuild` runs lint with --fix, which would mask failures in CI.
        run: npx nest build

      # GATING. Unit tests mock their database repositories (no PostgreSQL involved).
      - name: Unit tests (mocked dependencies)
        working-directory: ./backend
        run: npm test -- --ci --runInBand --passWithNoTests

      # GATING. Builds the schema with the repository's own migrations in the empty CI database,
      # which also proves the migrations apply from scratch.
      - name: Apply migrations to the test database
        working-directory: ./backend
        env:
          CLERK_SECRET_KEY: sk_test_ci_not_a_real_key
        run: npm run migration:run

      # GATING. Boots the real application against real PostgreSQL with synthetic users and checks
      # authentication and per-user ownership. Only Clerk's network calls (and the ESM-only tRPC
      # module) are stubbed; see test/support/access-control-harness.ts. Never point this at a real
      # database: it creates and deletes users matching *@access-test.invalid.
      - name: Access-control tests (real PostgreSQL)
        working-directory: ./backend
        env:
          CLERK_SECRET_KEY: sk_test_ci_not_a_real_key
        run: npm run test:integration -- --ci

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: ./frontend
        run: npm ci

      # GATING since the error count reached 0 (224 -> 0; no rules disabled). Warnings
      # (exhaustive-deps, fast-refresh exports, incompatible-library) are reported, not gating.
      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        run: npm run build

      # Now GATING. The debt this was tracking is paid off: 358 -> 0, with no
      # suppressions and no loosened compiler options. There is nothing left to
      # tolerate, so a reintroduced error fails the build.
      #
      # `npm run typecheck` is `tsc -b --force`, and the `-b` matters. The root
      # tsconfig.json is a project-references file listing no files of its own, so
      # `tsc --noEmit -p tsconfig.json` type-checks nothing and exits 0 — it looks
      # like a clean run and is the reason this debt went unnoticed for so long.
      - name: Type-check
        working-directory: ./frontend
        run: npm run typecheck

      # GATING (component and utility tests; run `npx vitest run` for the current count).
      - name: Tests
        working-directory: ./frontend
        run: npx vitest run --passWithNoTests

  # GATING. Builds the production frontend image the way docker-compose.yml does (context = the
  # repository root, so the shared invoice-money module is included), runs it, and checks what
  # nginx actually serves. The publishable key is a syntactically valid dummy: without one the
  # bundler drops the app and only the configuration screen is left.
  frontend-image:
    name: Frontend image (docker build + smoke)
    runs-on: ubuntu-latest
    env:
      # pk_test_ + base64("dummy.clerk.accounts.dev$"). Not a real Clerk instance.
      DUMMY_PK: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA==
      MONEY_MARKER: 'must be a decimal number (no exponent'
    steps:
      - uses: actions/checkout@v4

      - name: Build the builder stage and inspect its context
        run: |
          # Decoys: local env files a developer might have. None may reach the image.
          for f in .env .env.local .env.development .env.staging; do
            echo "DECOY_SECRET=must-not-be-in-the-image" > "frontend/$f"
          done
          docker build -f frontend/Dockerfile --target builder \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY="$DUMMY_PK" -t av-frontend-builder .
          echo '--- files under /backend in the builder stage:'
          docker run --rm av-frontend-builder find /backend -type f | tee backend-files.txt
          # The root .dockerignore must admit exactly one file from backend/.
          test "$(cat backend-files.txt)" = /backend/src/common/money/invoice-money.ts
          echo '--- env files in /app:'
          docker run --rm av-frontend-builder sh -c 'ls -a /app | grep "^\.env" || true' | tee env-files.txt
          # Only the committed example may be there; .env / .env.local must never reach the build.
          if grep -vx '.env.example' env-files.txt; then echo 'unexpected env file in build context'; exit 1; fi
          if docker run --rm av-frontend-builder grep -rl DECOY_SECRET /app /backend 2>/dev/null; then
            echo 'a decoy env file reached the build context'; exit 1
          fi
          rm -f frontend/.env frontend/.env.local frontend/.env.development frontend/.env.staging

      - name: Build fails without a publishable key
        run: |
          if docker build -f frontend/Dockerfile --target builder . > no-key.log 2>&1; then
            cat no-key.log; echo 'build without VITE_CLERK_PUBLISHABLE_KEY should have failed'; exit 1
          fi
          grep -q 'VITE_CLERK_PUBLISHABLE_KEY is not set' no-key.log
          echo 'refused as expected'

      - name: Build the production image
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY="$DUMMY_PK" -t av-frontend .
          docker image ls av-frontend

      - name: Inspect the served directory
        run: |
          docker run --rm av-frontend find /usr/share/nginx/html -type f | sort | tee html-files.txt
          if grep -E '(^|/)\.env|\.map$|\.tsx?$|backend' html-files.txt; then
            echo 'served directory contains env files, source maps, sources or backend files'; exit 1
          fi
          grep -q '^/usr/share/nginx/html/index.html$' html-files.txt

      - name: Run the container and smoke-check it
        run: |
          docker run -d --name av-frontend -p 8080:80 av-frontend
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          base=http://localhost:8080

          echo '--- GET /'
          curl -fsS -D root.headers -o index.html "$base/"
          head -n1 root.headers; grep -i '^x-content-type-options' root.headers
          grep -q '<div id="root">' index.html

          echo '--- entry script referenced by index.html'
          entry=$(grep -oE 'src="/assets/[^"]+\.js"' index.html | head -n1 | cut -d'"' -f2)
          test -n "$entry"; echo "$entry"
          curl -fsS -D entry.headers -H 'Accept-Encoding: gzip' -o /dev/null "$base$entry"
          head -n1 entry.headers
          grep -iE '^content-type: (application|text)/javascript' entry.headers
          grep -i '^content-encoding: gzip' entry.headers
          grep -i '^cache-control: public, immutable' entry.headers
          grep -i '^x-content-type-options: nosniff' entry.headers

          echo '--- SPA deep link /invoices/create'
          code=$(curl -sS -o deep.html -w '%{http_code}' "$base/invoices/create")
          echo "HTTP $code"; test "$code" = 200; cmp deep.html index.html

          echo '--- missing asset is a 404, not index.html'
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$base/assets/does-not-exist.js")
          echo "HTTP $code"; test "$code" = 404

          echo '--- every served JS asset, fetched over HTTP'
          mkdir -p served
          for f in $(grep '\.js$' html-files.txt); do
            rel=${f#/usr/share/nginx/html}
            curl -fsS -o "served/$(basename "$rel")" "$base$rel"
          done
          ls served | wc -l
          echo '--- shared invoice-money module is in the bundle'
          grep -lF "$MONEY_MARKER" served/*.js
          echo '--- the build-arg key reached the bundle'
          grep -lF "$DUMMY_PK" served/*.js

      - name: Container log
        if: always()
        run: docker logs av-frontend 2>&1 | tail -n 40 || true

      - name: Build the dev image
        run: docker build -f frontend/Dockerfile.dev -t av-frontend-dev .

  # GATING. Builds the API image and validates the Compose file; does not run the API
  # (that needs a migrated database and a Clerk instance).
  backend-image:
    name: Backend image (docker build) + Compose config
    runs-on: ubuntu-latest
    env:
      CLERK_SECRET_KEY: sk_test_ci_not_a_real_key
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA==
    steps:
      - uses: actions/checkout@v4

      - name: Build the backend image
        run: |
          docker build -t av-backend backend
          docker run --rm av-backend node --version
          docker run --rm av-backend test -f dist/main.js
          docker run --rm av-backend sh -c 'test ! -d node_modules/@nestjs/cli' && echo 'no dev dependencies'

      - name: Validate docker-compose.yml
        run: |
          docker compose config --quiet
          docker compose config --services
          test "$(docker compose config --services | sort | tr '\n' ' ')" = 'backend frontend postgres '
          test "$(docker compose --profile dev config --services | grep -c frontend-dev)" = 1

      - name: Start the postgres service
        run: |
          docker compose up -d --wait postgres
          docker compose exec -T postgres psql -U postgres -d invoiceme -c 'select 1'
          docker compose down -v

  # GATING. The built API image, the built frontend and PostgreSQL running together, with
  # synthetic data only (users *@full-stack.invalid in a throwaway CI database).
  #
  # Real: the API image from backend/Dockerfile running dist/main with NODE_ENV=production, the
  # schema built by the repository's migrations, every guard, and @clerk/backend verifyToken()
  # checking RS256 session tokens signed with a key pair generated in this job and given to the
  # API as CLERK_JWT_KEY (the SDK's networkless mode). The frontend is a production `vite build`
  # served by `vite preview`, checked over HTTP and in headless Chromium.
  #
  # Stand-in: Clerk's users.getUser(), the per-request user re-check, is answered from a file by
  # backend/test/full-stack/clerk-users-stub.cjs, preloaded with NODE_OPTIONS and mounted
  # read-only; it is not in the image. A local HTTP stub of Clerk's API is not possible without
  # an application change: the guard calls createClerkClient({ secretKey }) with no apiUrl, and
  # @clerk/backend does not read one from the environment.
  #
  # Not covered: signing in through Clerk in the browser (clerk-js loads from a real Clerk
  # instance's frontend API), and therefore the web app's own authenticated API calls.
  full-stack:
    name: Full stack (API image + built frontend + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asset_vault_full_stack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: asset_vault_full_stack
      # Not a real Clerk key; the stub refuses to load with anything but sk_test_.
      CLERK_SECRET_KEY: sk_test_full_stack_not_a_real_key
      # pk_test_ + base64("dummy.clerk.accounts.dev$"). Not a real Clerk instance.
      DUMMY_PK: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA==
      API_URL: http://localhost:3000/api/v1
      FRONTEND_ORIGIN: http://localhost:4173
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # The API image has no migration runner, so the schema is built from the checkout.
      - name: Install backend and apply migrations
        working-directory: ./backend
        run: |
          npm ci
          npm run migration:run

      - name: Build the API image
        run: docker build -t av-backend backend

      - name: Generate the throwaway signing keys and synthetic Clerk users
        run: node backend/test/full-stack/prepare.cjs "$RUNNER_TEMP/full-stack"

      - name: Start the API
        run: |
          docker run -d --name av-api --network host \
            -v "$GITHUB_WORKSPACE/backend/test/full-stack:/full-stack:ro" \
            -v "$RUNNER_TEMP/full-stack/clerk-directory.json:/fs/clerk-directory.json:ro" \
            -e NODE_ENV=production -e PORT=3000 \
            -e DB_HOST -e DB_PORT -e DB_USERNAME -e DB_PASSWORD -e DB_DATABASE \
            -e CLERK_SECRET_KEY \
            -e CLERK_JWT_KEY="$(cat "$RUNNER_TEMP/full-stack/jwt-public.pem")" \
            -e FRONTEND_URL="$FRONTEND_ORIGIN" \
            -e FULL_STACK_CLERK_STUB=1 -e FULL_STACK_CLERK_DIRECTORY=/fs/clerk-directory.json \
            -e NODE_OPTIONS='--require /full-stack/clerk-users-stub.cjs' \
            av-backend
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null -H 'X-Forwarded-Proto: https' "$API_URL/health" && break
            if [ "$(docker inspect -f '{{.State.Running}}' av-api)" != true ]; then docker logs av-api; exit 1; fi
            sleep 1
          done
          curl -fsS -H 'X-Forwarded-Proto: https' "$API_URL/health"; echo
          docker logs av-api 2>&1 | grep -F '[clerk-users-stub]'

      # Authentication (real verifyToken; forged, expired, alg-confusion, unknown and banned users),
      # invoice create / read / edit with totals checked against hand-computed values and the
      # database row, and ownership checks with a second user.
      - name: API flow (invoices, totals, ownership)
        working-directory: ./backend
        run: node test/full-stack/flow.cjs "$RUNNER_TEMP/full-stack"

      - name: Build the frontend against this API
        working-directory: ./frontend
        run: |
          npm ci
          VITE_CLERK_PUBLISHABLE_KEY="$DUMMY_PK" VITE_API_BASE_URL="$API_URL" npx vite build --manifest
          echo '--- the bundle calls this API'
          grep -lF "$API_URL" dist/assets/*.js

      - name: Serve it and check every route's chunk over HTTP
        working-directory: ./frontend
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null "$FRONTEND_ORIGIN/" && break; sleep 1; done
          node scripts/verify-route-chunks.mjs "$FRONTEND_ORIGIN" dist

      - name: Browser check (lazy page renders; failed chunk is recoverable)
        working-directory: ./frontend
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.59.1
          npx playwright install --with-deps chromium
          node scripts/browser-smoke.mjs "$FRONTEND_ORIGIN"

      - name: API log
        if: always()
        run: docker logs av-api 2>&1 | tail -n 80 || true

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Reported, not gating: a transitive advisory in a dev dependency should not
      # block a merge, but it should be visible in the run log.
      - name: Backend audit
        working-directory: ./backend
        run: npm audit --audit-level=high || true
      - name: Frontend audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true
