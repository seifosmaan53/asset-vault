name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    # A real PostgreSQL service. The unit suite below mocks its repositories and does not use it;
    # the access-control suite (npm run test:integration) does, on a schema built by running the
    # repository's own migrations.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asset_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: asset_vault_test
      JWT_SECRET: ci-test-secret-not-used-anywhere-real
      # Dates in fixtures are compared literally; without a fixed zone the suite
      # passes locally and fails on a runner in a different offset.
      TZ: UTC

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: ./backend
        run: npm ci

      - name: Lint
        working-directory: ./backend
        run: npm run lint -- --max-warnings=0
        continue-on-error: true

      - name: Build
        working-directory: ./backend
        # `prebuild` runs lint with --fix, which would mask failures in CI.
        run: npx nest build

      # GATING. Unit tests mock their database repositories (no PostgreSQL involved).
      - name: Unit tests (mocked dependencies)
        working-directory: ./backend
        run: npm test -- --ci --runInBand --passWithNoTests

      # GATING. Builds the schema with the repository's own migrations in the empty CI database,
      # which also proves the migrations apply from scratch.
      - name: Apply migrations to the test database
        working-directory: ./backend
        env:
          CLERK_SECRET_KEY: sk_test_ci_not_a_real_key
        run: npm run migration:run

      # GATING. Boots the real application against real PostgreSQL with synthetic users and checks
      # authentication and per-user ownership. Only Clerk's network calls (and the ESM-only tRPC
      # module) are stubbed; see test/support/access-control-harness.ts. Never point this at a real
      # database: it creates and deletes users matching *@access-test.invalid.
      - name: Access-control tests (real PostgreSQL)
        working-directory: ./backend
        env:
          CLERK_SECRET_KEY: sk_test_ci_not_a_real_key
        run: npm run test:integration -- --ci

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Build
        working-directory: ./frontend
        run: npm run build

      # Now GATING. The debt this was tracking is paid off: 358 -> 0, with no
      # suppressions and no loosened compiler options. There is nothing left to
      # tolerate, so a reintroduced error fails the build.
      #
      # `npm run typecheck` is `tsc -b --force`, and the `-b` matters. The root
      # tsconfig.json is a project-references file listing no files of its own, so
      # `tsc --noEmit -p tsconfig.json` type-checks nothing and exits 0 — it looks
      # like a clean run and is the reason this debt went unnoticed for so long.
      - name: Type-check
        working-directory: ./frontend
        run: npm run typecheck

      # GATING (component and utility tests; run `npx vitest run` for the current count).
      - name: Tests
        working-directory: ./frontend
        run: npx vitest run --passWithNoTests

  # GATING. Builds the production frontend image the way docker-compose.yml does (context = the
  # repository root, so the shared invoice-money module is included), runs it, and checks what
  # nginx actually serves. The publishable key is a syntactically valid dummy: without one the
  # bundler drops the app and only the configuration screen is left.
  frontend-image:
    name: Frontend image (docker build + smoke)
    runs-on: ubuntu-latest
    env:
      # pk_test_ + base64("dummy.clerk.accounts.dev$"). Not a real Clerk instance.
      DUMMY_PK: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA==
      MONEY_MARKER: 'must be a decimal number (no exponent'
    steps:
      - uses: actions/checkout@v4

      - name: Build the builder stage and inspect its context
        run: |
          # Decoys: local env files a developer might have. None may reach the image.
          for f in .env .env.local .env.development .env.staging; do
            echo "DECOY_SECRET=must-not-be-in-the-image" > "frontend/$f"
          done
          docker build -f frontend/Dockerfile --target builder \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY="$DUMMY_PK" -t av-frontend-builder .
          echo '--- files under /backend in the builder stage:'
          docker run --rm av-frontend-builder find /backend -type f | tee backend-files.txt
          # The root .dockerignore must admit exactly one file from backend/.
          test "$(cat backend-files.txt)" = /backend/src/common/money/invoice-money.ts
          echo '--- env files in /app:'
          docker run --rm av-frontend-builder sh -c 'ls -a /app | grep "^\.env" || true' | tee env-files.txt
          # Only the committed example may be there; .env / .env.local must never reach the build.
          if grep -vx '.env.example' env-files.txt; then echo 'unexpected env file in build context'; exit 1; fi
          if docker run --rm av-frontend-builder grep -rl DECOY_SECRET /app /backend 2>/dev/null; then
            echo 'a decoy env file reached the build context'; exit 1
          fi
          rm -f frontend/.env frontend/.env.local frontend/.env.development frontend/.env.staging

      - name: Build fails without a publishable key
        run: |
          if docker build -f frontend/Dockerfile --target builder . > no-key.log 2>&1; then
            cat no-key.log; echo 'build without VITE_CLERK_PUBLISHABLE_KEY should have failed'; exit 1
          fi
          grep -q 'VITE_CLERK_PUBLISHABLE_KEY is not set' no-key.log
          echo 'refused as expected'

      - name: Build the production image
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY="$DUMMY_PK" -t av-frontend .
          docker image ls av-frontend

      - name: Inspect the served directory
        run: |
          docker run --rm av-frontend find /usr/share/nginx/html -type f | sort | tee html-files.txt
          if grep -E '(^|/)\.env|\.map$|\.tsx?$|backend' html-files.txt; then
            echo 'served directory contains env files, source maps, sources or backend files'; exit 1
          fi
          grep -q '^/usr/share/nginx/html/index.html$' html-files.txt

      - name: Run the container and smoke-check it
        run: |
          docker run -d --name av-frontend -p 8080:80 av-frontend
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          base=http://localhost:8080

          echo '--- GET /'
          curl -fsS -D root.headers -o index.html "$base/"
          head -n1 root.headers; grep -i '^x-content-type-options' root.headers
          grep -q '<div id="root">' index.html

          echo '--- entry script referenced by index.html'
          entry=$(grep -oE 'src="/assets/[^"]+\.js"' index.html | head -n1 | cut -d'"' -f2)
          test -n "$entry"; echo "$entry"
          curl -fsS -D entry.headers -H 'Accept-Encoding: gzip' -o /dev/null "$base$entry"
          head -n1 entry.headers
          grep -iE '^content-type: (application|text)/javascript' entry.headers
          grep -i '^content-encoding: gzip' entry.headers
          grep -i '^cache-control: public, immutable' entry.headers
          grep -i '^x-content-type-options: nosniff' entry.headers

          echo '--- SPA deep link /invoices/create'
          code=$(curl -sS -o deep.html -w '%{http_code}' "$base/invoices/create")
          echo "HTTP $code"; test "$code" = 200; cmp deep.html index.html

          echo '--- missing asset is a 404, not index.html'
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$base/assets/does-not-exist.js")
          echo "HTTP $code"; test "$code" = 404

          echo '--- every served JS asset, fetched over HTTP'
          mkdir -p served
          for f in $(grep '\.js$' html-files.txt); do
            rel=${f#/usr/share/nginx/html}
            curl -fsS -o "served/$(basename "$rel")" "$base$rel"
          done
          ls served | wc -l
          echo '--- shared invoice-money module is in the bundle'
          grep -lF "$MONEY_MARKER" served/*.js
          echo '--- the build-arg key reached the bundle'
          grep -lF "$DUMMY_PK" served/*.js

      - name: Container log
        if: always()
        run: docker logs av-frontend 2>&1 | tail -n 40 || true

      - name: Build the dev image
        run: docker build -f frontend/Dockerfile.dev -t av-frontend-dev .

  # GATING. Builds the API image and validates the Compose file; does not run the API
  # (that needs a migrated database and a Clerk instance).
  backend-image:
    name: Backend image (docker build) + Compose config
    runs-on: ubuntu-latest
    env:
      CLERK_SECRET_KEY: sk_test_ci_not_a_real_key
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA==
    steps:
      - uses: actions/checkout@v4

      - name: Build the backend image
        run: |
          docker build -t av-backend backend
          docker run --rm av-backend node --version
          docker run --rm av-backend test -f dist/main.js
          docker run --rm av-backend sh -c 'test ! -d node_modules/@nestjs/cli' && echo 'no dev dependencies'

      - name: Validate docker-compose.yml
        run: |
          docker compose config --quiet
          docker compose config --services
          test "$(docker compose config --services | sort | tr '\n' ' ')" = 'backend frontend postgres '
          test "$(docker compose --profile dev config --services | grep -c frontend-dev)" = 1

      - name: Start the postgres service
        run: |
          docker compose up -d --wait postgres
          docker compose exec -T postgres psql -U postgres -d invoiceme -c 'select 1'
          docker compose down -v

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Reported, not gating: a transitive advisory in a dev dependency should not
      # block a merge, but it should be visible in the run log.
      - name: Backend audit
        working-directory: ./backend
        run: npm audit --audit-level=high || true
      - name: Frontend audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

  # GATING. The migration release procedure (docs/operations/MIGRATIONS.md) on real containers:
  # the production backend image (compiled JS, production dependencies only) against a disposable
  # PostgreSQL 16 container. Proves: an outdated schema blocks API startup; a failing migration
  # stops docs/operations/release.sh before the API starts and leaves the database untouched; the
  # documented image command applies 1761000000000; the API then starts and serves /api/v1/health;
  # a rerun changes nothing; invoice_items rates and invoice totals are unchanged by the upgrade.
  migration-release:
    name: Migration release (backend image + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        # Explicit bash = `bash -eo pipefail`: a failure piped into tee still fails the step.
        shell: bash
    env:
      NET: av-release
      DB: asset_vault_release
      LAST: WidenInvoiceItemRatePrecision1761000000000
    steps:
      - uses: actions/checkout@v4

      - name: Build the backend image and start a disposable PostgreSQL
        run: |
          docker build -t av-backend backend
          docker network create "$NET"
          docker run -d --name av-pg --network "$NET" -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB="$DB" \
            --health-cmd pg_isready --health-interval 2s postgres:16-alpine
          for i in $(seq 1 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' av-pg)" = healthy ] && break; sleep 1; done
          docker exec av-pg psql -U postgres -d "$DB" -c 'select version()'
          cat > api.env <<EOF
          DB_HOST=av-pg
          DB_PORT=5432
          DB_USERNAME=postgres
          DB_PASSWORD=postgres
          DB_DATABASE=$DB
          CLERK_SECRET_KEY=sk_test_ci_not_a_real_key
          NODE_ENV=production
          FRONTEND_URL=http://localhost
          EOF
          sed -i 's/^ *//' api.env
          # Helpers for later steps.
          cat > sql.sh <<'EOF'
          #!/usr/bin/env bash
          docker exec -i av-pg psql -v ON_ERROR_STOP=1 -U postgres -d "$DB" -At -F'|' "$@"
          EOF
          sed -i 's/^ *//' sql.sh && chmod +x sql.sh

      - name: Outdated schema - every migration except the last, plus invoice data
        run: |
          # The released image's own runner, with the newest migration removed inside a throwaway container.
          docker run --rm --network "$NET" --env-file api.env --entrypoint sh av-backend \
            -c "rm dist/migrations/1761000000000-* && node dist/database/migration-runner.js"
          test "$(./sql.sh -c 'select count(*) from migrations')" = 40
          test "$(./sql.sh -c "select count(*) from migrations where name = '$LAST'")" = 0
          test "$(./sql.sh -c "select numeric_precision||','||numeric_scale from information_schema.columns where table_name='invoice_items' and column_name='taxRate'")" = 5,2
          ./sql.sh <<'SQL'
          INSERT INTO users (id, email, name) VALUES ('00000000-0000-4000-8000-000000000001', 'release@migration-test.invalid', 'Release check');
          INSERT INTO clients (id, "userId", name) VALUES ('00000000-0000-4000-8000-000000000002', '00000000-0000-4000-8000-000000000001', 'Release check client');
          INSERT INTO invoices (id, "userId", "clientId", type, number, status, "issueDate", subtotal, "taxTotal", "discountTotal", total)
          VALUES ('00000000-0000-4000-8000-000000000003', '00000000-0000-4000-8000-000000000001', '00000000-0000-4000-8000-000000000002',
                  'invoice', 'MIG-0001', 'draft', '2026-10-01', 200.0100, 17.7612, 10.0000, 207.7712);
          INSERT INTO invoice_items ("invoiceId", description, quantity, "unitPrice", "taxRate", "discountRate", "lineTotal") VALUES
            ('00000000-0000-4000-8000-000000000003', 'A two-decimal rates', 1, 100.0000, 8.88, 5.00, 103.4400),
            ('00000000-0000-4000-8000-000000000003', 'B max rates', 2, 50.0000, 999.99, 999.99, 104.3200),
            ('00000000-0000-4000-8000-000000000003', 'C tiny values', 1, 0.0100, 0.01, 0.00, 0.0100),
            ('00000000-0000-4000-8000-000000000003', 'D zero rates', 3, 33.3333, 0, 0, 99.9999);
          SQL
          cat > snapshot.sql <<'SQL'
          SELECT 'item', description, quantity, "unitPrice"::text, round("taxRate", 4)::text, round("discountRate", 4)::text, "lineTotal"::text FROM invoice_items ORDER BY description;
          SELECT 'invoice', number, subtotal::text, "taxTotal"::text, "discountTotal"::text, total::text, coalesce("amountPaid", 0)::text FROM invoices ORDER BY number;
          SQL
          ./sql.sh < snapshot.sql | tee before.txt
          test "$(wc -l < before.txt)" = 5

      - name: (a) The API refuses to start on the outdated schema
        run: |
          set +e
          docker run --name av-api-outdated --network "$NET" --env-file api.env av-backend > outdated.log 2>&1
          code=$?
          set -e
          cat outdated.log
          echo "exit code: $code"; test "$code" -ne 0
          grep -F 'Startup aborted: database schema is not current.' outdated.log
          grep -F "  - $LAST" outdated.log
          grep -F 'node dist/database/migration-runner.js' outdated.log
          if grep -F 'Nest application successfully started' outdated.log; then echo 'the API started'; exit 1; fi
          # The check is read-only.
          test "$(./sql.sh -c 'select count(*) from migrations')" = 40

      - name: (a) The API refuses to start when the database is unreachable
        run: |
          set +e
          docker run --rm --network "$NET" --env-file api.env -e DB_PORT=5999 av-backend > unreachable.log 2>&1
          code=$?
          set -e
          cat unreachable.log
          echo "exit code: $code"; test "$code" -ne 0
          grep -F 'Startup aborted: database unreachable.' unreachable.log
          grep -F 'Cannot connect to the database at av-pg:5999' unreachable.log

      - name: (e) A failing migration stops the release before the API starts
        run: |
          # Test-only image: the released image plus a harmless migration and one that must fail.
          # Never committed to backend/src/migrations.
          mkdir failing && cd failing
          cat > 1799999999998-ReleaseCheckMarker.js <<'EOF'
          "use strict";
          Object.defineProperty(exports, "__esModule", { value: true });
          class ReleaseCheckMarker1799999999998 { constructor() { this.name = 'ReleaseCheckMarker1799999999998'; }
            async up(q) { await q.query('CREATE TABLE "release_check_marker" (id int)'); }
            async down(q) { await q.query('DROP TABLE "release_check_marker"'); } }
          exports.ReleaseCheckMarker1799999999998 = ReleaseCheckMarker1799999999998;
          EOF
          cat > 1799999999999-ReleaseCheckMustFail.js <<'EOF'
          "use strict";
          Object.defineProperty(exports, "__esModule", { value: true });
          class ReleaseCheckMustFail1799999999999 { constructor() { this.name = 'ReleaseCheckMustFail1799999999999'; }
            async up(q) { await q.query('ALTER TABLE "invoice_items" ALTER COLUMN "taxRate" TYPE numeric(7,4) USING ("taxRate" / 0)'); }
            async down() {} }
          exports.ReleaseCheckMustFail1799999999999 = ReleaseCheckMustFail1799999999999;
          EOF
          printf 'FROM av-backend\nCOPY *.js dist/migrations/\n' > Dockerfile
          docker build -t av-backend-failing .
          cd ..
          set +e
          DOCKER_NETWORK="$NET" BACKUP_DIR=backups-failing API_CONTAINER=av-api-failing API_PORT=3001 \
            docs/operations/release.sh av-backend-failing api.env > failing.log 2>&1
          code=$?
          set -e
          cat failing.log
          echo "release exit code: $code"; test "$code" -ne 0
          grep -F 'pending: WidenInvoiceItemRatePrecision1761000000000' failing.log
          grep -F 'Migration FAILED; the transaction was rolled back' failing.log
          if grep -F '== 3/4' failing.log; then echo 'the release continued past the failed migration'; exit 1; fi
          test -z "$(docker ps -aq --filter name=^av-api-failing$)" && echo 'API container never created'
          # Nothing from the failed run was kept: not the marker, not 1761000000000.
          test "$(./sql.sh -c 'select count(*) from migrations')" = 40
          test "$(./sql.sh -c "select to_regclass('release_check_marker') is null")" = t
          test "$(./sql.sh -c "select numeric_precision||','||numeric_scale from information_schema.columns where table_name='invoice_items' and column_name='taxRate'")" = 5,2
          ./sql.sh < snapshot.sql | diff before.txt -

      - name: (b)(c) Release - backup, the documented image command, startup, health
        run: |
          DOCKER_NETWORK="$NET" BACKUP_DIR=backups API_CONTAINER=av-api API_PORT=3000 \
            docs/operations/release.sh av-backend api.env | tee release.log
          grep -F 'backup written and readable' release.log
          grep -F 'Database av-pg:5432/asset_vault_release as postgres: 41 migration(s) in this build, 1 pending.' release.log
          grep -F 'Applied 1 migration(s):' release.log
          grep -F "  - $LAST" release.log
          grep -F '"status":"ok"' release.log
          ls -l backups/*.dump
          docker logs av-api 2>&1 | grep -F 'Database schema is current (41 migrations applied).'
          code=$(curl -sS -o health.json -w '%{http_code}' -H 'X-Forwarded-Proto: https' http://127.0.0.1:3000/api/v1/health)
          cat health.json; echo; echo "HTTP $code"; test "$code" = 200
          test "$(./sql.sh -c "select count(*) from migrations where name = '$LAST'")" = 1

      - name: (f) Rates and totals unchanged across the upgrade
        run: |
          ./sql.sh < snapshot.sql | tee after.txt
          diff before.txt after.txt && echo 'invoice_items rates and invoice totals identical'
          test "$(./sql.sh -c "select string_agg(column_name||' '||numeric_precision||','||numeric_scale, '; ' order by column_name) from information_schema.columns where table_name='invoice_items' and column_name in ('taxRate','discountRate')")" = 'discountRate 7,4; taxRate 7,4'
          # The new precision is usable (inside a transaction that is rolled back).
          ./sql.sh -c "begin; update invoice_items set \"taxRate\" = 8.875 where description = 'A two-decimal rates'; select \"taxRate\" from invoice_items where description = 'A two-decimal rates'; rollback;" | grep -x '8.8750'

      - name: (d) Rerunning the migration command changes nothing
        run: |
          # Stop the API so only the migration command can touch the database between the dumps.
          docker stop av-api
          # pg_dump >= 16.10 brackets its output with \restrict/\unrestrict and a random key per run.
          dump() { docker exec av-pg pg_dump -U postgres -d "$DB" | grep -vE '^\\(un)?restrict '; }
          dump > dump-before.sql
          docker run --rm --network "$NET" --env-file api.env av-backend node dist/database/migration-runner.js | tee rerun.log
          grep -Fx 'No pending migrations. Nothing was changed.' rerun.log
          dump > dump-after.sql
          wc -l dump-before.sql
          diff dump-before.sql dump-after.sql && echo 'schema and data identical after the rerun'

      - name: Container logs
        if: always()
        run: |
          for c in av-api av-api-outdated; do echo "--- $c"; docker logs "$c" 2>&1 | tail -n 40 || true; done
