# Production-like stack: a TLS reverse proxy (Caddy) in front of the API and the web app.
#
#   docker compose up -d --build                 build and start everything
#   docker compose run --rm backend node dist/database/migration-runner.js   apply migrations
#   docker compose up -d --wait                  (re)start the API once the schema is current
#   open https://localhost                       the browser-usable entry point
#
# Only the proxy publishes ports (80 -> redirect, 443 -> TLS). The API and the web app are
# reachable only through it: the API runs with NODE_ENV=production, redirects plain HTTP to
# HTTPS and trusts X-Forwarded-* from exactly one hop (the proxy), so it is not usable directly.
# The API refuses to start while migrations are pending (docs/operations/MIGRATIONS.md).
# Details, TLS for a real domain and the dev profile: docs/setup/DOCKER_README.md.

services:
  postgres:
    image: postgres:15-alpine
    container_name: asset-vault-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-invoiceme}
    # Loopback only, for psql / backups from this host; the API reaches it on the stack network.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # The schema comes from the backend's migrations (docs/setup/DOCKER_README.md), not
    # from an init script: the backend/scripts/init.sql this used to mount never existed,
    # and Docker turned the missing path into a directory that broke database init.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asset-vault-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-invoiceme}
      # Authentication is Clerk. The API refuses to start without CLERK_SECRET_KEY, so it has no
      # default here: set it in the environment or in a root .env file used by `docker compose`.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY (from the Clerk dashboard)}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      # Optional PEM public key: lets the API verify session tokens without calling Clerk's JWKS endpoint.
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      # The browser origin: the only origin CORS allows in production. Same origin as the proxy
      # (SITE_ADDRESS), so the web app's API calls are same-origin. Browsers send the origin
      # without a default port: https://localhost, not https://localhost:443.
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
      # Where the production HTTP->HTTPS redirect points; defaults to FRONTEND_URL's host.
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      # Trust X-Forwarded-* from exactly one hop: the proxy, the only thing that can reach this
      # port (no `ports:` below). Never publish the API port with this setting.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Graceful shutdown bound: in-flight requests get this long after SIGTERM, then exit 1.
      # Must stay below stop_grace_period, after which Docker sends SIGKILL.
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-8000}
    # Not published on the host: reachable only through the proxy.
    expose:
      - "3000"
    stop_grace_period: 15s
    # GET /api/v1/health over loopback (queries PostgreSQL). Fails while the API is down, e.g.
    # when it refused to start because migrations are pending.
    healthcheck:
      test: ["CMD", "node", "dist/server/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    # Production mode: Use built image (no volume mounts)
    # For development with hot-reload, uncomment below:
    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules
    # command: npm run start:dev

  frontend:
    build:
      # Repository root: the image includes backend/src/common/money/invoice-money.ts,
      # the invoice-money module shared with the API (see /.dockerignore).
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Vite inlines these at build time, so they are build args. The publishable key
        # is required and has no default: set it in the environment or the root .env
        # (it is public by design; the Clerk SECRET key never goes here). Rebuild
        # (`docker compose build frontend`) after changing either value.
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        # Same origin as the page, through the proxy.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: asset-vault-frontend
    # Not published on the host: reachable only through the proxy.
    expose:
      - "80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf

  # TLS termination and routing (deploy/caddy/Caddyfile). The only service with host ports.
  proxy:
    image: caddy:2.8.4-alpine
    container_name: asset-vault-proxy
    environment:
      # The public host name. localhost by default; a real DNS name for a deployment.
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      # internal = Caddy's local CA (dev/CI); an e-mail address = ACME (Let's Encrypt).
      CADDY_TLS: ${CADDY_TLS:-internal}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  # Hot-reload dev server. Only started with the dev profile:
  #   FRONTEND_URL=http://localhost:5173 docker compose --profile dev up -d
  # It reads VITE_* variables from frontend/.env (mounted with the source); point
  # VITE_API_BASE_URL at https://localhost/api/v1 (the API through the proxy) and trust the
  # proxy's local CA (docs/setup/DOCKER_README.md, "Hot-reload frontend").
  frontend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: asset-vault-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # The invoice-money module shared with the API (the `@invoice-money` alias).
      - ./backend/src/common/money:/backend/src/common/money:ro
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=150
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend

volumes:
  postgres_data:
  # Caddy's certificates and its local CA. Keep it: deleting it issues a new CA to re-trust.
  caddy_data:
  caddy_config:

